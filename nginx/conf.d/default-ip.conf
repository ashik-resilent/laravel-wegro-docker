# Default server block for IP address access on port 80
# This handles requests to the server IP directly (138.68.55.52)
# Note: nginx-proxy will auto-generate configs for containers with VIRTUAL_HOST
# This file provides a fallback for direct IP access

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Proxy to call-service if available
    location / {
        # Check if call-service container exists and is healthy
        set $upstream http://call-service:80;
        
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 80;
        
        # HTTP version and connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Error handling - if call-service is not available, nginx-proxy will handle it
        # via its default 503 response
    }
}
