# Custom server block for callcircle.resilentsolutions.com on port 8883 (HTTP)
# This file is included by nginx-proxy's main nginx.conf
# It handles HTTP requests on port 8883 and proxies to call-service:80

server {
    listen 8883;
    listen [::]:8883;
    server_name callcircle.resilentsolutions.com 138.68.55.52;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy to call-service container (Laravel on port 80 internally)
    location / {
        proxy_pass http://call-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 8883;
        
        # HTTP version and connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Handle redirects
        proxy_redirect off;
    }
}
